[workspace]
members = [".", "crates/fffinder-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Darren Schroeder"]
repository = "https://github.com/fdncred/fffinder"

[workspace.dependencies]
fffinder-core = { path = "crates/fffinder-core" }
fff-search = "0.11.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
thiserror = "2"

[package]
name = "fffinder"
description = "A fast, cross-platform Finder-style file search app built on fff-search and GPUI Kit"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "fffinder"
path = "src/lib.rs"

[[bin]]
name = "fffinder"
path = "src/main.rs"

[features]
# `fffinder --term`: the window drawn inside a terminal with the kitty graphics
# protocol (macOS and Linux). GPUI only builds its offscreen renderer with
# gpui-kit's `test-support`, so this turns that on for the whole app.
term = [
    "gpui-kit/test-support",
    "dep:base64",
    "dep:crossterm",
    "dep:flate2",
    "dep:futures",
    "dep:libc",
    "dep:raw-window-handle",
]

[dependencies]
fffinder-core.workspace = true
gpui-kit = "0.7.3"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
log.workspace = true
trash = "5"
# Hands control-socket requests to the UI thread.
async-channel = "2"
# Code previews: grammars and themes for syntax highlighting, in pure Rust.
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
# Font previews: the family name inside a font file.
ttf-parser = "0.25"
# Colors file names the way Nushell's `ls` does.
lscolors = { version = "0.21", default-features = false }
# `term` feature: frames as kitty graphics escape codes, and the types GPUI's
# platform traits are written in.
base64 = { version = "0.22", optional = true }
flate2 = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
raw-window-handle = { version = "0.6", optional = true }

# `term` feature: terminal input and raw mode, ioctl, and shared memory.
[target.'cfg(unix)'.dependencies]
crossterm = { version = "0.29", optional = true, default-features = false, features = [
    "bracketed-paste",
    "events",
] }
libc = { version = "0.2", optional = true }

# Finder's own colors and icons, read from AppKit at run time.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
# Thumbnails of PDFs, videos, and every other type macOS understands.
objc2-quick-look-thumbnailing = "0.3"

# Windows: files on the clipboard, Open With, shortcuts, and thumbnails, as
# Explorer has them. `png` saves the thumbnails.
[target.'cfg(windows)'.dependencies]
png = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }

# Embeds the app icon in the Windows executable.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = "limited"

[profile.release]
lto = "thin"
codegen-units = 16

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
fff-search = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
resvg = { opt-level = 3 }
image = { opt-level = 3 }
# crossterm takes one off SGR mouse coordinates, which underflows on the pixel
# position 0 that Ghostty sends in pixel mode; `term::input` undoes it with a
# wrapping add, as release builds already wrap.
crossterm = { overflow-checks = false }
