name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Run every test binary, so one run shows every failure.
      - run: cargo test --workspace --no-fail-fast
      # Terminal mode, `fffinder --term`, is macOS and Linux only.
      - if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets --features term -- -D warnings
      - if: runner.os != 'Windows'
        run: "cargo test --lib --features term -- term::"
      - name: Check Nushell scripts
        shell: nu {0}
        run: |
          # The `fff` module for your config, and the starter actions. A
          # relative path would resolve against this step's temporary script.
          nu-check --debug --as-module ('nu/fff.nu' | path expand)
          nu-check --debug --as-module ('assets/actions.nu' | path expand)
          for file in (glob scripts/*.nu) {
            if ($file | path basename) == 'common.nu' {
              nu-check --debug --as-module $file
            } else {
              nu-check --debug $file
            }
          }
